        .accept {
            background-color: #4CAF50;
            color: white;
        }
        .reject {
            background-color: #f44336;
            color: white;
        }
        .settings {
            background-color: #008CBA;
            color: white;
        }
        .cookie-settings {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            padding: 20px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            text-align: center;
        }
    </style>


    <div class="cookie-banner" id="cookieBanner">
        Questo sito utilizza i cookie per migliorare l'esperienza utente. <br>
        <button class="accept" onclick="setCookiePreferences(true)">Accetta</button>
        <button class="reject" onclick="setCookiePreferences(false)">Rifiuta</button>
        <button class="settings" onclick="showSettings()">Personalizza</button>
        <br>
        <a href="cookie.html" target="_blank">Leggi la nostra Cookie Policy</a>
    </div>

    <div class="cookie-settings" id="cookieSettings">
        <h2>Preferenze Cookie</h2>
        <label><input type="checkbox" id="essentialCookies" checked="" disabled=""> Cookie Essenziali (Obbligatori)</label><br>
        <label><input type="checkbox" id="performanceCookies"> Cookie di Prestazione e Analisi</label><br>
        <label><input type="checkbox" id="marketingCookies"> Cookie di Marketing e Tracciamento</label><br>
        <button class="accept" onclick="savePreferences()">Salva Preferenze</button>
    </div>

    <script>
        function setCookiePreferences(accepted) {
            localStorage.setItem("cookieAccepted", accepted);
            document.getElementById("cookieBanner").style.display = "none";
        }
        
        function showSettings() {
            document.getElementById("cookieSettings").style.display = "block";
        }
        
        function savePreferences() {
            let performance = document.getElementById("performanceCookies").checked;
            let marketing = document.getElementById("marketingCookies").checked;
            localStorage.setItem("performanceCookies", performance);
            localStorage.setItem("marketingCookies", marketing);
            document.getElementById("cookieSettings").style.display = "none";
            document.getElementById("cookieBanner").style.display = "none";
        }
        
        window.onload = function() {
            if (localStorage.getItem("cookieAccepted") !== null) {
                document.getElementById("cookieBanner").style.display = "none";
            }
        }
    </script>


</div>
